<!doctype html>
<html><head><meta charset="utf-8"><title>MedAdhere</title>
<!-- Animated dashboard tour for the README (dashboard-tour.gif). Uses the real screenshots in ../ -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1100px; height: 900px; background: #0a1322; font-family: "Avenir Next", "Helvetica Neue", sans-serif; overflow: hidden; }
  .win { position: absolute; left: 30px; top: 76px; width: 1040px; height: 800px; border-radius: 14px; overflow: hidden;
    background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,.5), 0 0 0 1px #24344a; }
  .bar { height: 44px; background: #e9ecf1; display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid #d5dae2; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .url { margin-left: 18px; flex: 1; height: 28px; border-radius: 8px; background: #fff; color: #5b6676; font-size: 14px;
    display: flex; align-items: center; padding-left: 14px; font-family: -apple-system, "Helvetica Neue", sans-serif; }
  .view { position: relative; height: 756px; overflow: hidden; }
  .view img { position: absolute; top: 0; left: 0; width: 1040px; }
  .tabs { position: absolute; top: 22px; left: 30px; display: flex; gap: 12px; }
  .tab { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; padding: 8px 16px; border-radius: 999px; color: #7f93ad; border: 1px solid #1f3a4f; }
  .tab.on { color: #04120e; background: #2dd4a7; border-color: #2dd4a7; }
  .brand { position: absolute; top: 28px; right: 34px; color: #2dd4a7; font-size: 15px; font-weight: 700; letter-spacing: 3px; }
</style><link rel="stylesheet" href="visual-theme.css">
</head>
<body data-view="tour">
  <div class="tabs"><span class="tab">Cohort overview</span><span class="tab">Patient detail</span><span class="tab">Enroll patient</span></div>
  <div class="brand">Clinician dashboard</div>
  <div class="win">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
      <div class="url" id="url">medadhere / dashboard</div></div>
    <div class="view">
      <img src="../dashboard-overview.png"><img src="../dashboard-patient.png"><img src="../dashboard-enroll.png">
    </div>
  </div>
<script>
const imgs = [...document.querySelectorAll('.view img')], tabs = [...document.querySelectorAll('.tab')];
const urls = ['medadhere / dashboard', 'medadhere / patients / detail', 'medadhere / patients / enroll'];
// state: {i: current, t: fade progress to next (0..1), y: scroll px of current}
window.setState = s => {
  const n = (s.i + 1) % imgs.length;
  imgs.forEach((im, k) => { im.style.opacity = k === s.i ? 1 : k === n ? s.t : 0; im.style.zIndex = k === n ? 2 : 1;
    im.style.transform = `translateY(${k === s.i ? -(s.y || 0) : 0}px)`; });
  const active = s.t > 0.5 ? n : s.i;
  tabs.forEach((t, k) => t.classList.toggle('on', k === active));
  document.getElementById('url').textContent = urls[active];
};
</script></body></html>
